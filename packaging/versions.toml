linux_url = "https://github.com/encounter/nod/releases/download/v2.0.0-alpha.12/nodtool-linux-x86_64"
linux_sha256 = "ee8345c004248eb82a86dd0c6068e0fcf3dc75baf68d18fe949bf4589822f5a5"
