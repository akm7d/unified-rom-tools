# Everything the Linux and Windows builds depend on, pinned in one place.
# To update a dependency: change it here, run `make all`, and check both self-tests pass.
# The app's own version lives in romtools/__init__.py (__version__).

[pip]
# Installed into the build environments (a venv on Linux, Windows Python under Wine).
"PySide6-Essentials" = "6.12.0"
"pyinstaller" = "6.22.3"

[python_windows]
# Official Windows installer from python.org (sha256 from python.org's release listing).
version = "3.14.10"
url = "https://www.python.org/ftp/python/3.14.10/python-3.14.10-amd64.exe"
sha256 = "92480239264744fe0386a1bd8275786fefa126e3129e56a68e22b52c73329965"

[chdman_windows]
# chdman.exe bundled in the Windows build, taken from MAME's official release.
# Its SHA-256 is checked against the SHA256SUMS file MAME publishes with each release.
mame_tag = "mame0289"

[sevenzip_windows]
# 7z.exe / 7z.dll bundled in the Windows build (archive hashing, chdman updates).
# Same file on github.com/ip7z/7zip and 7-zip.org (checked 2026-11-22).
version = "26.06"
url = "https://github.com/ip7z/7zip/releases/download/26.06/7z2606-x64.exe"
sha256 = "9b697f65ecc2d9b0152f5ee96d72dde522a7827690349d9307935dacf40f42ec"
