# Everything the Linux and Windows builds depend on, pinned in one place.
# To update a dependency: change it here, run `make all`, and check both self-tests pass.
# The app's own version lives in romtools/__init__.py (__version__).

[pip]
# Installed into the build environments (a venv on Linux, Windows Python under Wine).
"PySide6-Essentials" = "6.12.0"
"pyinstaller" = "6.22.3"

[python_linux]
# Portable CPython for the Linux build (python-build-standalone: built against an old glibc, so the build runs
# on most distros; the distro's own Python is built for its own, newer glibc). sha256 from the release's SHA256SUMS.
version = "3.14.10"
url = "https://github.com/astral-sh/python-build-standalone/releases/download/20261110/cpython-3.14.10+20261110-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
sha256 = "c2ff2e97422f5d3896a16e0317fd212ba977bbf2688d93a6f7a03d817506bd30"

[python_windows]
# Official Windows installer from python.org (sha256 from python.org's release listing).
version = "3.14.10"
url = "https://www.python.org/ftp/python/3.14.10/python-3.14.10-amd64.exe"
sha256 = "92480239264744fe0386a1bd8275786fefa126e3129e56a68e22b52c73329965"

[chdman_windows]
# chdman.exe bundled in the Windows build, taken from MAME's official release.
# Its SHA-256 is checked against the SHA256SUMS file MAME publishes with each release.
mame_tag = "mame0289"

[chdman_linux]
# chdman bundled in the Linux build: built from the same MAME release's official source package by build.py
# (C++ runtime linked in, a stub for the 4 unused SDL clipboard calls), so it only needs glibc.
mame_tag = "mame0289"

[sevenzip_linux]
# 7zzs (fully static 7-Zip) bundled in the Linux build, from 7-Zip's official GitHub releases.
version = "26.06"
url = "https://github.com/ip7z/7zip/releases/download/26.06/7z2606-linux-x64.tar.xz"
sha256 = "2b539cf067b2ad48e1baa5093dbaa8818b73542d1222a0ffde9dc5f2922ea62e"

[xdelta3]
# Official xdelta3 release binaries (jmacd/xdelta on GitHub) for xdelta patches; bundled in both builds.
version = "3.2.2"
linux_url = "https://github.com/jmacd/xdelta/releases/download/v3.2.2/xdelta3-3.2.2-linux-x86_64.tar.gz"
linux_sha256 = "a8ce7d2c943ae2b3d308942643cb36d4805a1f16775abe1be64fee292d7c2506"
windows_url = "https://github.com/jmacd/xdelta/releases/download/v3.2.2/xdelta3-3.2.2-windows-x86_64.zip"
windows_sha256 = "d48f7651d86b78fdca397057b46601f89131f37219675df736db70af44ec3379"

[nodtool]
